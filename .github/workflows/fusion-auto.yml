# Gabarit RucheLab « dépôt client » (ops/depot-client).
# Chaque envoi d'une conversation Claude (branche claude/...) est versé dans main.
# Conflit : rien n'échoue (aucun mail d'erreur chez la personne). Le hook sync-main de la conversation
# concernée reçoit le conflit au message suivant, Claude le résout, et l'envoi suivant passe ici sans conflit.
# Une Action ne peut pas ouvrir de PR sans un réglage que seul le propriétaire active : on n'en dépend pas.
name: Fusion automatique dans main

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write

concurrency:
  group: fusion-main
  cancel-in-progress: false

jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verser la branche dans main
        env:
          BRANCHE: ${{ github.ref_name }}
        run: |
          git config user.name "fusion-auto"
          git config user.email "fusion-auto@users.noreply.github.com"
          for essai in 1 2 3; do
            git fetch -q origin main "$BRANCHE"
            git checkout -q -B main origin/main
            if git merge-base --is-ancestor "origin/$BRANCHE" main; then
              echo "Déjà dans main."
              exit 0
            fi
            if ! git merge --no-edit -q "origin/$BRANCHE" -m "Fusion automatique de $BRANCHE"; then
              git merge --abort
              echo "::warning::Conflit avec main sur $BRANCHE : la conversation le résout au prochain message."
              exit 0
            fi
            git push -q origin main && { echo "Versé dans main."; exit 0; }
            sleep 5
          done
          exit 1
